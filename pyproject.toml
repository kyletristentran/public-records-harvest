[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-records-harvest"
version = "0.1.0"
description = "One fetch path for every public-records scraper: cache, rate limit, retry, provenance"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
store = ["duckdb>=1.0", "pyarrow>=16.0"]

[tool.setuptools]
# Flat layout with two top-level packages; setuptools refuses to guess, so say so.
packages = ["harvest", "adapters"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
